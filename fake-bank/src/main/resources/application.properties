spring.application.name=fake-bank
server.port=9090

# ── Outcome rates (must sum to 1.0) ──────────────────────────────────────────
# Probability that POST /bank/payouts returns ACCEPTED
bank.accept-rate=0.80
# Probability that it returns REJECTED (final, no callback)
bank.reject-rate=0.08
# Probability of no-response: connection held 60s then 504
# Implicit: no-response-rate = 1 - accept-rate - reject-rate = 0.12

# ── No-response sub-behaviour ────────────────────────────────────────────────
# Of no-response payouts, fraction that the bank did process (callback follows)
bank.no-response-processed-rate=0.50

# ── Accepted payout final outcome ────────────────────────────────────────────
# Of accepted payouts, fraction that ultimately FAIL (rest SUCCEED)
bank.callback-fail-rate=0.05

# ── Callback behaviour ───────────────────────────────────────────────────────
# Fraction of accepted payouts whose callback is sent 2-3 times concurrently
bank.duplicate-callback-rate=0.30
# Minimum and maximum delay before sending the first callback (seconds)
bank.callback-delay-min-seconds=1
bank.callback-delay-max-seconds=10
# Retry: if no 2xx within this many ms, retry
bank.callback-timeout-ms=2000
# Maximum number of retry attempts after the initial send
bank.callback-max-retries=5
# Delay between retries (seconds)
bank.callback-retry-interval-seconds=3

# ── Latency simulation ────────────────────────────────────────────────────────
# Normal response latency range for POST /bank/payouts (seconds)
bank.min-latency-seconds=2
bank.max-latency-seconds=6
# No-response hold duration before 504 (seconds)
bank.no-response-hold-seconds=60
# GET /bank/payouts/{id} latency range (seconds)
bank.get-min-latency-seconds=1
bank.get-max-latency-seconds=3

# ── Callback target ───────────────────────────────────────────────────────────
# Comma-separated list of wallet-service base URLs to send callbacks to.
# The fake bank picks one at random per callback, so both instances receive traffic.
bank.callback-urls=http://localhost:8081/mpesa/v1/callbacks/bank,http://localhost:8082/mpesa/v1/callbacks/bank

# ── Tomcat ────────────────────────────────────────────────────────────────────
# Must be large enough to hold all concurrent no-response connections.
# 5000 payouts * 12% no-response = ~600 threads potentially blocked.
server.tomcat.threads.max=800
server.tomcat.threads.min-spare=10
