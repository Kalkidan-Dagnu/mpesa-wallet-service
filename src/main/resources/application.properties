spring.application.name=wallet-service

# ── Tomcat ────────────────────────────────────────────────────────────────────
server.port=${INSTANCE_PORT:8080}
server.tomcat.threads.max=50

# ── PostgreSQL DataSource ──────────────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/wallet_db}
spring.datasource.username=${DB_USER:wallet_user}
spring.datasource.password=${DB_PASS:wallet_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── HikariCP connection pool ───────────────────────────────────────────────────
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=2000
spring.datasource.hikari.pool-name=${spring.application.name}-${INSTANCE_ID:0}-pool

# ── JPA / Hibernate ────────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Pessimistic lock timeout for PUT /status.
# If another transaction holds the row lock for longer than 1800 ms, Postgres
# raises lock_not_available and Spring throws PessimisticLockingFailureException.
# 1800 ms leaves 200 ms for the response to travel back within the 2 s SLA.
spring.jpa.properties.jakarta.persistence.lock.timeout=1800
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20

# ── Instance identity ──────────────────────────────────────────────────────────
# Exposed via /actuator/info
instance.id=${INSTANCE_ID:unknown}
